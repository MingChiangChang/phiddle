[project]
name = "phiddle"
version = "0.2.0"
description = "GUI for XRD phase identification in laser annealing experiments"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ming-Chiang Chang", email = "mc2663@cornell.edu" }]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.15.1",
    "matplotlib>=3.10.7",
    "numpy",
    "pandas>=2.3.3",
    "pymatgen>=2025.10.7",
    "pyqt6>=6.10.0",
    "requests>=2.32.5",
    "scipy",
    "tqdm>=4.67.1",
    "xrayutilities>=1.7.7",
]

[project.urls]
Homepage = "https://github.com/MingChiangChang/phiddle"

# A build backend keeps `pip install .` working for non-uv users.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phiddle"]
